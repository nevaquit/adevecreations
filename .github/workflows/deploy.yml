name: Deploy to adevecreations.com

on:
  push:
      branches:
            - main

            jobs:
              deploy:
                  runs-on: ubuntu-latest
                      steps:
                            - name: Checkout
                                    uses: actions/checkout@v4

                                          - name: Setup Node
                                                  uses: actions/setup-node@v4
                                                          with:
                                                                    node-version: 20
                                                                              cache: npm
                                                                                        cache-dependency-path: client/package-lock.json

                                                                                              - name: Install dependencies
                                                                                                      run: npm ci
                                                                                                              working-directory: client
                                                                                                              
                                                                                                                    - name: Build
                                                                                                                            run: npm run build
                                                                                                                                    working-directory: client
                                                                                                                                    
                                                                                                                                          - name: Trigger cPanel Git pull and deploy
                                                                                                                                                  run: |
                                                                                                                                                            curl -s -o /dev/null -w "%{http_code}" \
                                                                                                                                                                        -H "Authorization: cpanel xgmztfmy:${{ secrets.CPANEL_API_TOKEN }}" \
                                                                                                                                                                                    "https://sh00251.bluehost.com:2083/execute/VersionControl/update?repository_root=%2Fhome2%2Fxgmztfmy%2Frepos%2Fadevecreations"
